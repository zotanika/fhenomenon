name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  python-model-sdk:
    name: Python Model SDK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install public SDK with CPU PyTorch
      run: |
        python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1'
        python -m pip install './python[ml]'

    - name: Test installed public SDK
      run: python -m unittest discover -s python/tests -v

    - name: Build native tensor libraries
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=OFF -DBUILD_DOCUMENTATION=OFF
        cmake --build build --target fhn_tensor_runtime -j2

    - name: Test encrypted execution and implementation identity
      env:
        FHN_LIBRARY_DIR: ${{ github.workspace }}/build/lib
      run: |
        python -m unittest \
          python.native_tests.test_backend python.native_tests.test_runtime \
          python.native_tests.test_scoped_runtime python.native_tests.test_scoped_tensor \
          python.native_tests.test_tensor_kernels python.native_tests.test_library_identity \
          python.native_tests.test_semantic_measurements python.native_tests.test_model_compiler \
          python.native_tests.test_kernel_issue_demo

  build-and-test:
    name: C++ Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

    - name: Build without tests or LTO
      run: |
        cmake -S cpp -B build-no-tests -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TEST=OFF -DBUILD_DOCUMENTATION=OFF -DDISABLE_LTO=ON
        cmake --build build-no-tests

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Rust formatting and lint
      working-directory: rust
      run: |
        cargo fmt --all -- --check
        cargo clippy --workspace --all-targets -- -D warnings

    - name: Rust tests with shared native provider
      working-directory: rust
      shell: bash
      run: |
        extension=so
        if [ "${{ runner.os }}" = "macOS" ]; then extension=dylib; fi
        FHN_NATIVE_TEST_LIBRARY="${{ github.workspace }}/build/lib/libckks_fhn.${extension}" \
          cargo test --workspace

    # ctest pipes gtest's fully-buffered stdout, so a crashing binary loses
    # its output tail and hides which case trapped. Re-run each case in its
    # own process to name the crasher, then dump any macOS crash reports.
    - name: Diagnose test crashes (macOS)
      if: runner.os == 'macOS' && failure()
      working-directory: build
      run: |
        for t in SessionTest FhnExternalBackendTest NoSessionTest; do
          echo "=== ${t}: per-case isolation ==="
          ./bin/${t} --gtest_list_tests | awk '/^[A-Za-z]/{suite=$1} /^  /{print suite $1}' | while read -r c; do
            if ./bin/${t} --gtest_filter="${c}" >/tmp/case.log 2>&1; then
              echo "PASS  ${c}"
            else
              echo "FAIL  ${c} (exit $?)"
              tail -60 /tmp/case.log
            fi
          done
        done
        echo "=== crash reports ==="
        for f in "$HOME"/Library/Logs/DiagnosticReports/*; do
          [ -f "$f" ] || continue
          echo "--- $f"
          head -120 "$f"
        done

    - name: Sanitizer build and test (macOS)
      if: runner.os == 'macOS' && always()
      run: |
        cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        cmake --build build-asan
        cd build-asan
        UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ctest --output-on-failure --no-tests=error
