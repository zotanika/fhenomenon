[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhenomenon"
version = "0.1.0"
description = "Model-facing contracts and compilation for Fhenomenon runtimes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.5", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fhenomenon*"]
